name: Update BVOL Data

on:
  schedule:
    - cron: '30 13 * * *'  # 매일 13:30 UTC (한국시간 22:30)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch BVOL + BTC data
        run: python fetch_bvol.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📊 Update BVOL data $(date -u +'%Y-%m-%d')"
          git push
