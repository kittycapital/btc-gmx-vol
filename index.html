<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --border-strong: rgba(255,255,255,0.12);
    --text: #e0e0e0;
    --text-dim: #888888;
    --text-muted: #555;
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,0.15);
    --btc-color: #f7931a;
    --primary: #3b82f6;
    --primary-light: #60a5fa;
    --primary-glow: rgba(59,130,246,0.12);
    --up: #22c55e;
    --elevated: #1a1a1a;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.5);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.7);
    --radius-md: 10px;
    --transition-fast: 150ms ease;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
  .container{max-width:1200px;margin:0 auto;padding:20px 16px 40px}

  /* Header — centered */
  .header{text-align:center;margin-bottom:20px}
  .header h1{font-size:20px;font-weight:700;letter-spacing:-0.02em}
  .header h1 span{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:500}
  .header .subtitle{font-size:13px;color:var(--text-dim);margin-top:4px;font-family:'JetBrains Mono',monospace}

  /* Controls — centered */
  .controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .btn-group{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .btn-group button{padding:8px 16px;font-size:13px;font-family:'Noto Sans KR',sans-serif;font-weight:500;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .2s}
  .btn-group button:hover{color:var(--text)}
  .btn-group button.active{background:var(--accent);color:#0a0a0a}
  .btn-group button+button{border-left:1px solid var(--border)}
  .range-group button{padding:8px 12px;font-size:12px;font-family:'JetBrains Mono',monospace}
  .range-group button.active{color:var(--accent);background:var(--accent-dim)}
  .zoom-reset-btn{padding:8px 14px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:500;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-dim);cursor:pointer;transition:all .2s;display:none}
  .zoom-reset-btn:hover{color:var(--accent);border-color:var(--accent)}
  .zoom-reset-btn.visible{display:block}

  /* Stats — centered */
  .stats-bar{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
  .stat-item{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
  .stat-label{font-size:12px;color:var(--text-dim)}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500}
  .stat-value.btc-c{color:var(--btc-color)}
  .stat-value.bvol-c{color:var(--accent)}

  /* Chart wrapper */
  .chart-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
  .chart-panel{position:relative;padding:8px 12px}
  .chart-panel.btc-panel{height:340px}
  .chart-panel.bvol-panel{height:200px;border-top:1px solid var(--border)}
  .panel-label{position:absolute;top:10px;left:14px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--text-dim);z-index:10;display:flex;align-items:center;gap:6px;pointer-events:none}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.btc{background:var(--btc-color)}
  .dot.bvol{background:var(--accent)}
  .log-toggle{position:absolute;top:8px;right:14px;z-index:10;display:flex;align-items:center;gap:6px}
  .log-toggle label{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);cursor:pointer}
  .log-toggle input{accent-color:var(--accent);cursor:pointer}
  .zoom-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);opacity:.5;pointer-events:none;z-index:10;transition:opacity .3s}
  .chart-wrapper:hover .zoom-hint{opacity:0}

  /* Loading */
  .loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);z-index:20;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:13px;transition:opacity .3s}
  .loading-overlay.hidden{opacity:0;pointer-events:none}
  .loading-overlay::after{content:'';width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin-left:10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Crosshair info */
  .crosshair-info{position:absolute;top:10px;right:90px;z-index:15;font-family:'JetBrains Mono',monospace;font-size:12px;pointer-events:none;display:flex;gap:16px;opacity:0;transition:opacity .15s}
  .crosshair-info.visible{opacity:1}
  .ci-date{color:var(--text-dim)}
  .ci-btc{color:var(--btc-color)}
  .ci-bvol{color:var(--accent)}

  /* Share bar — from macro-1.html */
  .share-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 12px 12px}
  .share-bar-preview{font-size:.75rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%;line-height:1.4;font-family:'JetBrains Mono',monospace}
  .share-bar-preview span{color:var(--text-dim);font-weight:500}
  .share-bar-buttons{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .share-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:.75rem;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all var(--transition-fast);border:1px solid var(--border-strong);background:var(--surface);color:#999;white-space:nowrap}
  .share-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);color:var(--text)}
  .share-btn svg{flex-shrink:0}
  .share-btn--x:hover{border-color:#fff;color:#fff;background:#111}
  .share-btn--kakao:hover{border-color:#FEE500;color:#191919;background:#FEE500}
  .share-btn--tg:hover{border-color:#26A5E4;color:#fff;background:rgba(38,165,228,.15)}
  .share-btn--copy:hover{border-color:var(--primary);color:var(--primary-light);background:var(--primary-glow)}

  /* Toast */
  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--elevated);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:10px 18px;font-size:.788rem;color:var(--text);box-shadow:var(--shadow-lg);animation:toastIn .3s ease;border-left:3px solid var(--up)}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* Footer */
  .footer{margin-top:20px;padding:12px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .footer .source,.footer .updated{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;line-height:1.6}

  @media(max-width:768px){
    .container{padding:12px 10px 32px}
    .chart-panel.btc-panel{height:260px}
    .chart-panel.bvol-panel{height:160px}
    .stats-bar{gap:8px}
    .stat-item{padding:8px 12px}
    .stat-value{font-size:13px}
    .share-bar{flex-direction:column;gap:10px;align-items:stretch}
    .share-bar-preview{max-width:100%}
    .share-bar-buttons{justify-content:center;flex-wrap:wrap}
    .share-btn span.label-text{display:none}
    .share-btn{padding:8px 10px}
  }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════
   SHARE (macro-1 style)
   ═══════════════════════════════════════════════ */
var SHARE_URL='https://herdvibe.com/133';

function ensureKakao(){try{if(typeof Kakao!=='undefined'&&!Kakao.isInitialized())Kakao.init('a43ed7b39fac35458f4f9df925a279b5');return typeof Kakao!=='undefined'&&Kakao.isInitialized();}catch(e){return false;}}

function kakaoShare(){if(!ensureKakao()){copyToClipboard(SHARE_URL);toast('링크 복사완료! 카카오톡에 붙여넣기 하세요');return;}try{Kakao.Share.sendDefault({objectType:'feed',content:{title:'비트코인 역사적 변동성 (.BVOL)',description:'BTC 가격과 BVOL 30일 연간화 변동성 지수 실시간 분석',imageUrl:'https://raw.githubusercontent.com/kittycapital/kittycapital.github.io/main/assets/herdvibe-og.png',link:{mobileWebUrl:SHARE_URL,webUrl:SHARE_URL}},buttons:[{title:'대시보드 보기',link:{mobileWebUrl:SHARE_URL,webUrl:SHARE_URL}}]});}catch(e){copyToClipboard(SHARE_URL);toast('링크 복사완료! 카카오톡에 붙여넣기 하세요');}}

function copyToClipboard(text){try{window.parent.postMessage({type:'clipboard',text:text},'*');}catch(e){}}

function flashCopied(btn){if(!btn)return;var orig=btn.innerHTML;btn.style.background='#22c55e';btn.style.color='#fff';btn.style.borderColor='#22c55e';var hasLabel=btn.querySelector('.label-text');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>'+(hasLabel?'<span class="label-text" style="color:#fff">복사됨!</span>':'');setTimeout(function(){btn.style.background='';btn.style.color='';btn.style.borderColor='';btn.innerHTML=orig;},2000);}

function doShare(p,btn){var u=SHARE_URL;var t=encodeURIComponent('비트코인 역사적 변동성 (.BVOL) | herdvibe.com');var eu=encodeURIComponent(u);switch(p){case'twitter':window.open('https://twitter.com/intent/tweet?text='+t+'&url='+eu,'_blank');break;case'telegram':window.open('https://t.me/share/url?url='+eu+'&text='+t,'_blank');break;case'kakao':kakaoShare();break;case'instagram':copyToClipboard(u);flashCopied(btn);toast('링크 복사완료! 인스타그램에 붙여넣기 하세요');break;case'link':copyToClipboard(u);flashCopied(btn);toast('링크가 복사되었습니다 ✓');break;}}

function toast(msg){var c=document.querySelector('.toast-wrap');if(!c){c=document.createElement('div');c.className='toast-wrap';document.body.appendChild(c);}var t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateY(12px)';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},3000);}

/* ═══════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════ */
var rawData=null,btcChart=null,bvolChart=null;
var currentTab='daily',currentRange=1825,isLogScale=true;
var isSyncing=false;
var filteredCache={dates:[],btc:[],bvol:[]};

/* ═══════════════════════════════════════════════
   CROSSHAIR PLUGIN
   ═══════════════════════════════════════════════ */
var crosshairPlugin={
  id:'crosshairLine',
  afterDraw:function(chart){
    var x=chart._crosshairX;
    if(x==null)return;
    var ctx=chart.ctx,top=chart.chartArea.top,bottom=chart.chartArea.bottom;
    ctx.save();ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);
    ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.setLineDash([4,3]);ctx.stroke();ctx.restore();
  }
};
Chart.register(crosshairPlugin);

/* ═══════════════════════════════════════════════
   DATA
   ═══════════════════════════════════════════════ */
async function loadData(){
  try{
    rawData=await(await fetch('./data/bvol_data.json')).json();
    document.getElementById('loadingOverlay').classList.add('hidden');
    updateStats();renderCharts();
  }catch(e){document.getElementById('loadingOverlay').textContent='데이터를 불러올 수 없습니다';}
}

function getFilteredData(){
  if(!rawData)return{dates:[],btc:[],bvol:[]};
  var dates=rawData.dates,btc=rawData.btc_close,bvol=rawData.bvol;
  if(currentRange>0){
    var cutoff=new Date();cutoff.setDate(cutoff.getDate()-currentRange);
    var cs=cutoff.toISOString().slice(0,10);
    var si=dates.findIndex(function(d){return d>=cs;});
    if(si>0){dates=dates.slice(si);btc=btc.slice(si);bvol=bvol.slice(si);}
  }
  return currentTab==='weekly'?aggregateWeekly(dates,btc,bvol):{dates:dates,btc:btc,bvol:bvol};
}

function aggregateWeekly(dates,btc,bvol){
  var w={dates:[],btc:[],bvol:[]};var wb=null,wv=null;
  for(var i=0;i<dates.length;i++){
    if(btc[i]!=null)wb=btc[i];if(bvol[i]!=null)wv=bvol[i];
    if(new Date(dates[i]).getDay()===5||i===dates.length-1){
      w.dates.push(dates[i]);w.btc.push(wb);w.bvol.push(wv);wb=null;wv=null;
    }
  }
  return w;
}

/* ═══════════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════════ */
function updateStats(){
  if(!rawData)return;
  var btc=rawData.btc_close,bvol=rawData.bvol;
  var lb=null,lv=null;
  for(var i=btc.length-1;i>=0;i--){
    if(lb==null&&btc[i]!=null)lb=btc[i];
    if(lv==null&&bvol[i]!=null)lv=bvol[i];
    if(lb!=null&&lv!=null)break;
  }
  document.getElementById('stat-btc').textContent=lb?'$'+lb.toLocaleString('en-US',{maximumFractionDigits:0}):'—';
  document.getElementById('stat-bvol').textContent=lv!=null?lv.toFixed(2)+'%':'—';
  var r=bvol.slice(-365).filter(function(v){return v!=null;});
  var avg=r.length?r.reduce(function(a,b){return a+b;},0)/r.length:0;
  document.getElementById('stat-bvol-avg').textContent=avg.toFixed(2)+'%';
  var z=document.getElementById('stat-bvol-zone');
  if(lv!=null){
    if(lv<30){z.textContent='🟢 저변동';z.style.color='#00d4aa';}
    else if(lv<60){z.textContent='🟡 보통';z.style.color='#ffd700';}
    else if(lv<90){z.textContent='🟠 고변동';z.style.color='#ff8c00';}
    else{z.textContent='🔴 극단적';z.style.color='#ff4976';}
  }
  if(rawData.updated_at){
    var d=new Date(rawData.updated_at);
    document.getElementById('updatedAt').textContent='업데이트: '+d.toLocaleDateString('ko-KR')+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  }
}

/* ═══════════════════════════════════════════════
   ZOOM SYNC
   ═══════════════════════════════════════════════ */
function syncXAxis(source,target){
  if(isSyncing||!source||!target)return;
  isSyncing=true;
  var sx=source.scales.x;
  target.options.scales.x.min=sx.min;target.options.scales.x.max=sx.max;
  target.update('none');isSyncing=false;
}
function showResetBtn(){document.getElementById('zoomResetBtn').classList.add('visible');}
function hideResetBtn(){document.getElementById('zoomResetBtn').classList.remove('visible');}
function zoomOpts(getOther){return{
  zoom:{wheel:{enabled:true,speed:0.08},pinch:{enabled:true},mode:'x',onZoom:function(ctx){showResetBtn();syncXAxis(ctx.chart,getOther());}},
  pan:{enabled:true,mode:'x',onPan:function(ctx){showResetBtn();syncXAxis(ctx.chart,getOther());}},
  limits:{x:{minRange:7*86400000}}
};}
function resetAllZoom(){
  if(btcChart)btcChart.resetZoom('none');
  if(bvolChart)bvolChart.resetZoom('none');
  hideResetBtn();
}

/* ═══════════════════════════════════════════════
   CROSSHAIR HOVER SYNC
   ═══════════════════════════════════════════════ */
function handleHover(src,tgt,e){
  var rect=src.canvas.getBoundingClientRect();
  var cx=e.clientX||(e.touches&&e.touches[0]&&e.touches[0].clientX);
  if(cx==null)return;
  var canvasX=cx-rect.left;
  var left=src.chartArea.left,right=src.chartArea.right;
  if(canvasX<left||canvasX>right){clearCrosshair();return;}
  src._crosshairX=canvasX;src.draw();
  if(tgt){var pct=(canvasX-left)/(right-left);var ta=tgt.chartArea;tgt._crosshairX=ta.left+pct*(ta.right-ta.left);tgt.draw();}
  updateCrosshairInfo(src.scales.x.getValueForPixel(canvasX));
}
function clearCrosshair(){
  [btcChart,bvolChart].forEach(function(c){if(c){c._crosshairX=null;c.draw();}});
  document.getElementById('crosshairInfo').classList.remove('visible');
}
function updateCrosshairInfo(ts){
  var d=filteredCache.dates;if(!d.length)return;
  var target=new Date(ts).toISOString().slice(0,10);
  var lo=0,hi=d.length-1,n=0;
  while(lo<=hi){var m=(lo+hi)>>1;if(d[m]<=target){n=m;lo=m+1;}else hi=m-1;}
  var bv=filteredCache.btc[n],vv=filteredCache.bvol[n];
  document.getElementById('ciDate').textContent=d[n];
  document.getElementById('ciBtc').textContent=bv!=null?'BTC $'+bv.toLocaleString('en-US',{maximumFractionDigits:0}):'';
  document.getElementById('ciBvol').textContent=vv!=null?'BVOL '+vv.toFixed(2)+'%':'';
  document.getElementById('crosshairInfo').classList.add('visible');
}

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */
function renderCharts(){
  var data=getFilteredData();filteredCache=data;
  renderBtc(data);renderBvol(data);attachHover();hideResetBtn();
}
function renderBtc(data){
  var ctx=document.getElementById('btcChart').getContext('2d');
  if(btcChart)btcChart.destroy();
  var pts=[];for(var i=0;i<data.dates.length;i++){if(data.btc[i]!=null)pts.push({x:data.dates[i],y:data.btc[i]});}
  var grad=ctx.createLinearGradient(0,0,0,320);
  grad.addColorStop(0,'rgba(247,147,26,0.12)');grad.addColorStop(1,'rgba(247,147,26,0.0)');
  var tu=currentRange<=730?'month':'year';
  btcChart=new Chart(ctx,{type:'line',data:{datasets:[{data:pts,borderColor:'#f7931a',borderWidth:1.5,backgroundColor:grad,fill:true,pointRadius:0,pointHitRadius:4,tension:0.1}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false},zoom:zoomOpts(function(){return bvolChart;})},
      scales:{
        x:{type:'time',time:{unit:tu,displayFormats:{month:'yyyy-MM',year:'yyyy'}},grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},ticks:{font:{family:"'JetBrains Mono',monospace",size:10},color:'#555',maxTicksLimit:10},border:{display:false}},
        y:{type:isLogScale?'logarithmic':'linear',position:'right',grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},ticks:{font:{family:"'JetBrains Mono',monospace",size:10},color:'#555',callback:function(v){return v>=1000?'$'+(v/1000).toFixed(0)+'K':'$'+v;},maxTicksLimit:6},border:{display:false}}
      }
    }
  });
}
function renderBvol(data){
  var ctx=document.getElementById('bvolChart').getContext('2d');
  if(bvolChart)bvolChart.destroy();
  var pts=[];for(var i=0;i<data.dates.length;i++){if(data.bvol[i]!=null)pts.push({x:data.dates[i],y:data.bvol[i]});}
  var avg=pts.length?pts.reduce(function(s,p){return s+p.y;},0)/pts.length:0;
  var grad=ctx.createLinearGradient(0,0,0,180);
  grad.addColorStop(0,'rgba(0,212,170,0.15)');grad.addColorStop(1,'rgba(0,212,170,0.0)');
  var tu=currentRange<=730?'month':'year';
  bvolChart=new Chart(ctx,{type:'line',data:{datasets:[
    {label:'BVOL',data:pts,borderColor:'#00d4aa',borderWidth:1.5,backgroundColor:grad,fill:true,pointRadius:0,pointHitRadius:4,tension:0.1},
    {label:'AVG',data:pts.map(function(p){return{x:p.x,y:avg};}),borderColor:'rgba(255,255,255,0.12)',borderWidth:1,borderDash:[4,4],pointRadius:0,pointHitRadius:0,fill:false}
  ]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false},zoom:zoomOpts(function(){return btcChart;})},
      scales:{
        x:{type:'time',time:{unit:tu,displayFormats:{month:'yyyy-MM',year:'yyyy'}},grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},ticks:{font:{family:"'JetBrains Mono',monospace",size:10},color:'#555',maxTicksLimit:10},border:{display:false}},
        y:{position:'right',min:0,grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},ticks:{font:{family:"'JetBrains Mono',monospace",size:10},color:'#555',callback:function(v){return v+'%';},maxTicksLimit:5},border:{display:false}}
      }
    }
  });
}

/* ═══════════════════════════════════════════════
   HOVER
   ═══════════════════════════════════════════════ */
function attachHover(){
  var wrapper=document.getElementById('chartWrapper');
  var bc=document.getElementById('btcChart'),vc=document.getElementById('bvolChart');
  wrapper.onmousemove=function(e){
    var br=bc.getBoundingClientRect(),vr=vc.getBoundingClientRect();
    if(e.clientY>=br.top&&e.clientY<=br.bottom)handleHover(btcChart,bvolChart,e);
    else if(e.clientY>=vr.top&&e.clientY<=vr.bottom)handleHover(bvolChart,btcChart,e);
  };
  wrapper.ontouchmove=wrapper.onmousemove;
  wrapper.onmouseleave=clearCrosshair;
}

/* ═══════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════ */
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');currentTab=b.dataset.tab;renderCharts();
  });
});
document.querySelectorAll('[data-range]').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('[data-range]').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');currentRange=parseInt(b.dataset.range);renderCharts();
  });
});
document.getElementById('logScale').addEventListener('change',function(e){isLogScale=e.target.checked;renderCharts();});
document.getElementById('zoomResetBtn').addEventListener('click',resetAllZoom);
document.getElementById('chartWrapper').addEventListener('dblclick',resetAllZoom);

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */
function postHeight(){window.parent.postMessage({type:'herdvibe-height',height:document.documentElement.scrollHeight},'*');}
loadData().then(function(){postHeight();window.addEventListener('resize',postHeight);});
</script>
